# Flashcards CI Pipeline (Plan 1.5 — FOUND-07)
#
# Triggers on: PR to `main` + push to `main`.
# Gates: install (shared cache) → lint, format, typecheck, test (parallel) → build → e2e.
# Aux jobs:
#   - types-fresh   (ACTIVE since Plan 1.9 — `types/database.types.ts`)
#   - supabase-lint (ACTIVE since Plan 1.9 — `supabase/migrations/*.sql` exist)
#   - e2e           (auto-skip via gate until Plans 1.12/1.13 wire `PLAYWRIGHT_BASE_URL` + Vercel preview)
#
# Branch protection on `main` (set manually per Plan 1.5 Task 4) enforces these as required
# status checks. Direct push to `main` is rejected; merge requires PR + ≥1 reviewer +
# CODEOWNERS approval + all required checks green. Admin-bypass is OFF (T-1.5-02).
#
# Source: RESEARCH.md §Pattern 4 (GitHub Actions CI Pipeline) + STACK.md §10.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: read source + write PR comments / status (T-1.5-06).
permissions:
  contents: read
  pull-requests: write

env:
  PNPM_VERSION: 9.15.9

jobs:
  # --- Install: warm pnpm-store + node_modules cache for downstream jobs. -------
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

  # --- Lint: ESLint flat config + no-mercy gates (no any, no UUIDs, no console). -
  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # --- Format: Prettier check (separate job for clearer failure surface). ------
  format:
    name: format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # --- Typecheck: tsc --noEmit with strict tsconfig. --------------------------
  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # --- Test: Vitest with coverage. Per-path 90% on lib/{srs,queue,asaas,access}. -
  # Coverage report uploaded as artifact for debugging failed gates.
  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # --- Types-fresh: regenerates types/database.types.ts from linked Supabase ---
  # and surfaces drift. ACTIVE since Plan 1.9 (2026-05-26) — Plan 1.6 shipped
  # the canonical types file.
  #
  # continue-on-error: true — this is a DRIFT-DETECTION gate, not a correctness
  # gate. Failing here doesn't block merges because:
  #   1. The runner sometimes has IPv4-only egress to Supabase pooler
  #      (intermittent network issue, not code's fault)
  #   2. Management API output can have benign formatting deltas
  #   3. Stale types are caught downstream by `typecheck` if they actually
  #      break — drift without breakage is a soft warning.
  # When this job fails, the developer runs `pnpm types:gen` locally and
  # commits the result.
  types-fresh:
    name: types-fresh
    needs: install
    if: true
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # GH Actions runners are dual-stack but the Supabase pooler resolves to
      # IPv6 first; the runner subnet has no IPv6 egress, so `pg pull` fails
      # with "network is unreachable". Generate types via the Management API
      # (--project-id) which is HTTPS-only, sidestepping the network issue.
      - name: Generate types via Management API
        run: |
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" > types/database.types.ts
          pnpm exec prettier --write types/database.types.ts
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Warn if types are stale (non-blocking)
        run: |
          if ! git diff --exit-code types/database.types.ts; then
            echo "::warning::types/database.types.ts may be stale. Run 'pnpm types:gen' locally and commit if a real diff exists."
          fi
          # exit 0 unconditionally — drift is a warning, not a failure.
          # The job's only real failure mode is the network call to the
          # Management API, which is captured as a step error above. The
          # diff check is informational only.
          exit 0

  # --- Supabase-lint: lints supabase/migrations/*.sql against the linked project. -
  # ACTIVE since Plan 1.9 (2026-05-26) — Plans 1.7 F-001 + 1.8-A shipped the
  # first migrations (search_path fix + webhook_events).
  supabase-lint:
    name: supabase-lint
    needs: install
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `--linked` requires `supabase link --project-ref` first (writes
      # supabase/.temp/project-ref). We link non-interactively then lint.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db lint --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # --- Build: production Next.js bundle. Gated on lint/format/typecheck/test green. -
  # NEXT_PUBLIC_* secrets are placeholder in P1.5 (real values from P1.6/P1.10);
  # next 15.5 build tolerates empty values because env validation is lazy.
  build:
    name: build
    needs: [lint, format, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # Cache Next.js incremental build artifacts across runs on the same lockfile.
      - uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # --- E2E gate: ensures e2e only runs once PLAYWRIGHT_BASE_URL secret is set. -
  # We can't reference `secrets.*` directly in a job-level `if:` expression —
  # GitHub doesn't expose secret presence to that scope. The workaround is a
  # tiny preflight job that COPIES the secret into a step output (which IS
  # readable downstream) so the e2e job can gate on `needs.e2e-gate.outputs.run`.
  # Activates in Plan 1.12 when the secret is set to the Vercel preview pattern.
  e2e-gate:
    name: e2e-gate
    needs: build
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
        run: |
          if [ -n "$PLAYWRIGHT_BASE_URL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "PLAYWRIGHT_BASE_URL is set — e2e job will run."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PLAYWRIGHT_BASE_URL is empty — e2e job skipped (Plan 1.12 will wire this)."
          fi

  # --- E2E: Playwright smoke tests against Vercel preview URL. ------------------
  # SKIPPED until Plan 1.12 wires Vercel previews + Plan 1.13 ships the smoke spec.
  e2e:
    name: e2e
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Vercel preview
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_URL="${{ secrets.PLAYWRIGHT_BASE_URL }}"
          for i in {1..30}; do
            if curl -fsS "$PREVIEW_URL/api/healthz" > /dev/null; then
              echo "Preview live at $PREVIEW_URL"
              break
            fi
            sleep 10
          done
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
